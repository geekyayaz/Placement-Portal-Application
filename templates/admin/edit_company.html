<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h3>Edit Company — {{ company.company_name }}</h3>
            </div>
            <div class="card-body">
                <form action="/admin/company/edit/{{ company.company_id }}" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" name="company_name"
                               value="{{ company.company_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email"
                               value="{{ company.email }}" required>
                    </div>

                                        <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Leave blank to keep current password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">HR Contact</label>
                        <input type="text" class="form-control" name="hr_contact"
                               value="{{ company.hr_contact }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Website</label>
                        <input type="url" class="form-control" name="website"
                               value="{{ company.website }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Approval Status</label>
                        <select class="form-select" name="approval_status">
                            <option value="Pending"  {% if company.approval_status == "Pending"  %}selected{% endif %}>Pending</option>
                            <option value="Approved" {% if company.approval_status == "Approved" %}selected{% endif %}>Approved</option>
                            <option value="Rejected" {% if company.approval_status == "Rejected" %}selected{% endif %}>Rejected</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="/dashboard/admin" class="btn btn-secondary">Cancel</a>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
