<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h3>Edit My Profile</h3>
            </div>
            {% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
            <div class="card-body">
                <form action="/dashboard/student/edit" method="POST" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" name="full_name"
                               value="{{ current_user.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email"
                               value="{{ student.email }}" required>
                    </div>
                     {% if current_user.__class__.__name__ == 'Student'%}
                     
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password"
                               value="{{ student.password }}">
                    </div>
        {% endif %}
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" name="phone"
                               value="{{ student.phone }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <input type="text" class="form-control" name="branch"
                               value="{{ student.branch }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Institute</label>
                        <input type="text" class="form-control" name="institute"
                               value="{{ student.institute }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="number" class="form-control" name="cgpa"
                               value="{{ student.cgpa }}" step="0.01" min="0" max="10">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Graduation Year</label>
                        <input type="number" class="form-control" name="grad_year"
                               value="{{ student.grad_year }}">
                    </div>
                    <hr>
<div class="mb-3">
    <label class="form-label">Resume (PDF only)</label>
    {% if current_user.resume %}
    <div class="mb-2">
        <a href="{{ current_user.resume.file_path }}" target="_blank">View Current Resume</a>
    </div>
    {% endif %}
    <input type="file" class="form-control" name="resume" accept=".pdf">
    <small class="text-muted">Leave blank to keep existing resume</small>
</div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="/dashboard/student" class="btn btn-secondary">Cancel</a>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
